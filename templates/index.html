<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Master</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Google Fonts & Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/vintage.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IM+Fell+English:ital@0;1&family=Great+Vibes&family=Gloock&display=swap" rel="stylesheet">
</head>
<body>
    
  <!-- The entire Vue application will be rendered inside this div -->
  <div id="app">
    <navbar-component></navbar-component>

    <main class="container-fluid py-4">
        <!-- Vue Router will inject the correct page component here -->
        <router-view :key="$route.fullPath"></router-view>
    </main>
    
    <footer class="mt-auto">
        <p>© 2025 Quiz Master · Crafted with wisdom 🖋️</p>
    </footer>
  </div>

  <!-- DEPENDENCIES -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- YOUR VUE APPLICATION LOGIC -->
  <script type="module" src="/static/js/main.js"></script>

  <!-- Bootstrap 5 JS for dropdowns, etc. -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
